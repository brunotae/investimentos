 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}

form .f{margin-bottom:16px}

/* regra 6 + 10: tabelas */
.tw{overflow:auto;max-height:calc(100dvh - 170px);border:1px solid var(--ln);border-radius:16px;background:var(--card)}

.lk{text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--tx);background:none;border:0;font:inherit;padding:0}

.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.vfoot{margin-top:30px;padding-top:12px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mo);font:12px "IBM Plex Mono",monospace}

.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tema{border:2px solid var(--ln);border-radius:14px;padding:10px;cursor:pointer;text-align:left;font:500 13px "Inter Tight",Inter,sans-serif;color:var(--tx);background:var(--card)}

.ttool{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:8px 12px;font:500 13px "Inter Tight",Inter,sans-serif;cursor:pointer;min-height:36px}
.outras{max-width:220px;min-height:36px!important;padding:6px 10px!important;font-size:13px!important;border-radius:99px!important}

.pista:first-of-type{border-top:0}

.sq{flex:0 0 96px;min-height:64px;border:1px solid var(--ln);border-radius:12px;padding:8px;background:var(--bg);font-size:12px;line-height:1.3;position:relative;color:var(--tx);text-align:left;font-family:inherit}

.car{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:24px;animation:bob 1.4s ease-in-out infinite;pointer-events:none}

.car.go{animation:drive .6s ease-out}
@keyframes drive{from{transform:translate(-160%,0)}to{transform:translate(-50%,0)}}
</style>

const TIPOS={aporte:{n:"Aporte",ic:"↓",d:"dinheiro que entra no fundo"},investimento:{n:"Investimento",ic:"→",d:"dinheiro que vai para uma frente"},retorno:{n:"Retorno",ic:"↑",d:"lucro que volta"}};
const QUEM=["Tae","Neiva"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const brl2=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const ed=()=>S.papel==="editor";
const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function dObj(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)}
function dLong(iso){if(!iso)return"";const d=dObj(iso);return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`}
function dShort(iso){const d=dObj(iso);return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function parseBRL(s){s=String(s??"").trim().replace(/[R$\s]/g,"");if(!s)return NaN;
  if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".")}
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,"")}
  const n=Number(s);return isFinite(n)?n:NaN}
function frName(id){const f=S.frentes.find(x=>x.id===id);return f?f.nome:"—"}

/* ---------- QUADROS (não fecham ao clicar fora) ---------- */
function abrirQuadro(html,onClose){fecharQuadro(true);const ov=document.createElement("div");ov.className="ov";ov.id="ov";ov.innerHTML=`<div class="modal" role="dialog">${html}</div>`;
  ov.addEventListener("mousedown",e=>{if(e.target===ov){const m=ov.firstChild;m.classList.remove("shake");void m.offsetWidth;m.classList.add("shake")}});
  ov._onClose=onClose;document.body.appendChild(ov);document.body.style.overflow="hidden"}
function fecharQuadro(silent){const ov=$("#ov");if(!ov)return;ov.remove();document.body.style.overflow="";if(!silent&&ov._onClose)ov._onClose()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov")){const m=$("#ov").firstChild;m.classList.remove("shake");void m.offsetWidth;m.classList.add("shake")}});

/* ---------- AUTH ---------- */
async function boot(){
  const {data}=await sb.auth.getSession();
  S.user=data?.session?.user||null;
  if(!S.user)return showLogin();
  await reloadAll();
}
function show(id){["vLogin","vNoAccess","vApp"].forEach(v=>$("#"+v).hidden=v!==id);$("#tabs").hidden=id!=="vApp"}
function showLogin(){show("vLogin");$("#roleTag").hidden=true;setLoginMode()}
function setLoginMode(){$("#lgTitle").textContent=S.signup?"Criar minha senha":"Entrar";$("#lgBtn").textContent=S.signup?"Criar senha e entrar":"Entrar";
  $("#lgToggle").textContent=S.signup?"Já tenho senha · Entrar":"Primeiro acesso? Criar minha senha";$("#lgPass").autocomplete=S.signup?"new-password":"current-password"}
$("#lgToggle").onclick=e=>{e.preventDefault();S.signup=!S.signup;$("#lgMsg").innerHTML="";setLoginMode()};
$("#lgForm").onsubmit=async e=>{
  e.preventDefault();const em=$("#lgEmail").value.trim(),pw=$("#lgPass").value;const m=$("#lgMsg");
  [$("#lgEmail"),$("#lgPass")].forEach(x=>x.classList.remove("err"));
  if(!/^\S+@\S+\.\S+$/.test(em)){m.innerHTML='<div class="msg e">Digite um e-mail válido.</div>';$("#lgEmail").classList.add("err");$("#lgEmail").focus();return}
  if(pw.length<6){m.innerHTML='<div class="msg e">A senha precisa ter pelo menos 6 caracteres.</div>';$("#lgPass").classList.add("err");$("#lgPass").focus();return}
  $("#lgBtn").disabled=true;m.innerHTML='<div class="msg o">Entrando…</div>';
  const r=S.signup?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
  $("#lgBtn").disabled=false;
  if(r.error){const t=/invalid/i.test(r.error.message)?"E-mail ou senha incorretos. Se é seu primeiro acesso, toque em “Criar minha senha”.":/registered|exists/i.test(r.error.message)?"Esse e-mail já tem senha. Use “Entrar”.":r.error.message;
    m.innerHTML=`<div class="msg e">${esc(t)}</div>`;return}
  S.user=r.data.user||r.data.session?.user;if(!r.data.session){const s=await sb.auth.getSession();S.user=s.data?.session?.user||S.user}
  m.innerHTML="";await reloadAll();
};
async function logout(){await sb.auth.signOut();S.user=null;S.papel=null;showLogin()}

/* ---------- DATA ---------- */
async function reloadAll(){
  if(!S.user)return;
  const c=await sb.rpc("invest_claim");
  S.papel=c.error?null:c.data;
  if(!S.papel){show("vNoAccess");$("#naEmail").textContent=S.user.email;$("#roleTag").hidden=true;return}
  const [f,m,a]=await Promise.all([
    sb.from("invest_frentes").select("*").order("ordem",{ascending:true}),
    sb.from("invest_mov").select("*").order("data",{ascending:false}),
    sb.from("invest_acesso").select("*").order("created_at",{ascending:true})]);
  S.frentes=f.data||[];S.mov=(m.data||[]).sort((x,y)=>(y.data||"").localeCompare(x.data||"")||(y.created_at||"").localeCompare(x.created_at||""));S.acesso=a.data||[];
  show("vApp");$("#roleTag").hidden=false;$("#roleTag").textContent=ed()?"Editor":"Somente leitura";
  if(!ed()&&["novo","ajustes"].includes(S.tab))S.tab="painel";
  render();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.user&&!busy())reloadAll()});
setInterval(()=>{if(S.user&&!document.hidden&&!busy())reloadAll()},60000);
function busy(){return S.tab==="novo"&&S.draft||$("#ov")||S.frEdit}

/* ---------- CALC ---------- */
function totals(){
  const a=S.mov.filter(x=>x.status!=="cancelado");
  const sum=(arr)=>arr.reduce((s,x)=>s+Number(x.valor||0),0);
  const ap=a.filter(x=>x.tipo==="aporte"),inv=a.filter(x=>x.tipo==="investimento"),ret=a.filter(x=>x.tipo==="retorno");
  const porQuem={};ap.forEach(x=>{const k=x.quem||"Outros";porQuem[k]=(porQuem[k]||0)+Number(x.valor)});
  const porFr={};S.frentes.forEach(f=>porFr[f.id]={inv:0,ret:0});
  inv.forEach(x=>{if(x.frente_id&&porFr[x.frente_id])porFr[x.frente_id].inv+=Number(x.valor)});
  ret.forEach(x=>{if(x.frente_id&&porFr[x.frente_id])porFr[x.frente_id].ret+=Number(x.valor)});
  const A=sum(ap),I=sum(inv),R=sum(ret);
  return {A,I,R,saldo:A-I+R,porQuem,porFr,orc:S.frentes.filter(f=>f.ativo!==false).reduce((s,f)=>s+Number(f.orcamento||0),0)};
}

/* ---------- RENDER ---------- */
function render(){
  const tabs=[["painel","Painel"],...(ed()?[["novo","+ Novo"]]:[]),["lanc","Lançamentos"],["hist","Histórico"],...(ed()?[["ajustes","Ajustes"]]:[])];
  $("#tabs").innerHTML=tabs.map(([k,n])=>`<button class="tab ${S.tab===k?"on":""}" onclick="go('${k}')">${n}</button>`).join("");
  const TT={painel:["Painel do fundo","Aportes, investimentos e retornos · Tae & Neiva"],novo:["Novo lançamento","Registre aportes, investimentos nas frentes e retornos"],lanc:["Lançamentos","Toque no título da coluna para ordenar · filtre por coluna"],hist:["Histórico","Todos os registros, inclusive cancelados"],ajustes:["Ajustes","Frentes, orçamentos e quem tem acesso"]};
  $("#ttl").textContent=TT[S.tab][0];$("#sub").textContent=TT[S.tab][1];
  ({painel:rPainel,novo:rNovo,lanc:rLanc,hist:rHist,ajustes:rAjustes})[S.tab]();
  let dl=$("#descList");if(!dl){dl=document.createElement("datalist");dl.id="descList";document.body.appendChild(dl)}
  dl.innerHTML=[...new Set(S.mov.map(x=>x.descricao).filter(Boolean))].slice(0,40).map(d=>`<option value="${esc(d)}">`).join("");
}
function go(t){if(S.tab==="novo"&&t!=="novo"&&S.draft&&hasDraft()){if(!confirmTwice("leave","Sair sem salvar? Toque de novo."))return}
  S.tab=t;S.editId=null;S.frEdit=null;if(t!=="novo")S.draft=null;render();window.scrollTo(0,0)}
let _ct={};function confirmTwice(k,msg,btn){const now=Date.now();if(_ct[k]&&now-_ct[k]<4000){_ct={};return true}_ct[k]=now;toast(msg);if(btn){btn.dataset.o=btn.dataset.o||btn.textContent;btn.textContent=msg;setTimeout(()=>{if(btn.isConnected)btn.textContent=btn.dataset.o},4000)}return false}
function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.style.cssText="position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dk);color:var(--on);padding:10px 16px;border-radius:99px;font-size:13px;z-index:99;max-width:90vw;text-align:center";document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2600)}

function rPainel(){setTimeout(()=>document.querySelectorAll('.track').forEach(t=>{const c=t.querySelector('.sq.cur');if(c)t.scrollLeft=c.offsetLeft-t.offsetLeft-20}),0);
  const T=totals();const p=$("#pane");
  if(!S.mov.length){
    p.innerHTML=`<div class="card empty"><div class="big">💼</div><h2 style="margin-top:0">Nenhum lançamento ainda</h2>
    <p class="muted">${ed()?"Comece registrando os aportes (quanto cada um colocou). Depois lance os investimentos em cada frente.":"Assim que o Tae registrar os primeiros aportes, eles aparecem aqui."}</p>
    ${ed()?`<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="novo('aporte')">Registrar 1º aporte</button><button class="btn g" onclick="go('novo');setTimeout(()=>$('#impBox').hidden=false,0)">Importar de planilha</button><button class="btn g" onclick="go('ajustes')">Revisar frentes</button></div>`:""}</div>`+frentesCard(T);return}
  const pq=Object.entries(T.porQuem).map(([k,v])=>`${esc(k)} ${brl(v)}`).join(" · ")||"—";
  p.innerHTML=`<div class="grid4">
    <div class="card kpi"><div class="l">Total aportado</div><div class="v">${brl(T.A)}</div><div class="s">${pq}</div></div>
    <div class="card kpi"><div class="l">Investido nas frentes</div><div class="v">${brl(T.I)}</div><div class="s">${T.orc?Math.round(T.I/T.orc*100):0}% do orçamento de ${brl(T.orc)}</div></div>
    <div class="card kpi"><div class="l">Retornos</div><div class="v">${brl(T.R)}</div><div class="s">${T.I?((T.R/T.I*100).toFixed(1)+"% do investido"):"—"}</div></div>
    <div class="card kpi hi"><div class="l">Saldo em caixa</div><div class="v">${brl(T.saldo)}</div><div class="s">aportado − investido + retornos</div></div>
  </div>
  ${pistaCard()}
  <div class="two">${frentesCard(T)}
    <div class="card"><h2 style="margin-top:0">Últimos lançamentos</h2><div>${S.mov.filter(x=>x.status!=="cancelado").slice(0,6).map(itemHTML).join("")||'<p class="muted">—</p>'}</div>
    <button class="btn g sm" onclick="go('lanc')">Ver todos</button></div></div>`;
}
const CARROS=["🚗","🚙","🚕","🛻","🚌","🏎️","🚐"];
function etapas(f){return Array.isArray(f.etapas)?f.etapas.filter(Boolean):[]}
function pistaCard(){const fs=S.frentes.filter(f=>f.ativo!==false&&etapas(f).length);
  if(!fs.length)return ed()?`<div class="card" style="margin-bottom:14px"><h2 style="margin-top:0">Pista dos projetos</h2><p class="muted">Cadastre as etapas de cada frente em <button class="lk" onclick="go('ajustes')">Ajustes</button> para ver o carrinho andando.</p></div>`:"";
  return `<div class="card" style="margin-bottom:14px"><h2 style="margin-top:0">Pista dos projetos</h2>${fs.map((f,i)=>{const et=etapas(f);const cur=Math.min(Math.max(0,f.etapa||0),et.length-1);
   return `<div class="pista"><div class="hd"><b><button class="lk" onclick="verFrente('${f.id}')">${esc(f.nome)}</button></b><span>casa ${cur+1} de ${et.length} · ${esc(et[cur])}${f.etapa_desde?" · desde "+dShort(f.etapa_desde):""}</span></div>
   <div class="track" id="tr-${f.id}">${et.map((e,k)=>{const cls=k<cur?"done":k===cur?"cur":"";const tag=ed()?"button":"div";
     return `<${tag} class="sq ${cls} ${k===et.length-1?"fim":""}" ${ed()?`onclick="moverCarro('${f.id}',${k},this)" title="Mover o carrinho para cá"`:""}><span class="nb">${String(k+1).padStart(2,"0")}</span>${esc(e)}${k===cur?`<span class="car ${S.moved===f.id?"go":""}">${CARROS[i%CARROS.length]}</span>`:""}</${tag}>`}).join("")}</div>
   ${ed()&&cur<et.length-1?`<button class="btn g sm" style="margin-top:6px" onclick="moverCarro('${f.id}',${cur+1},this)">Avançar ▶ ${esc(et[cur+1])}</button>`:""}</div>`}).join("")}</div>`}
async function moverCarro(id,k,b){const f=S.frentes.find(x=>x.id===id);if(!f||(f.etapa||0)===k)return;
  if(!confirmTwice("mv"+id+k,`Mover para “${etapas(f)[k]}”? Toque de novo.`,b))return;
  const r=await sb.from("invest_frentes").update({etapa:k,etapa_desde:todayISO()}).eq("id",id);if(r.error){toast("Erro: "+r.error.message);return}
  S.moved=id;toast("Carrinho andou: "+etapas(f)[k]);await reloadAll();setTimeout(()=>{S.moved=null;const t=$("#tr-"+id);const c=t&&t.querySelector(".sq.cur");if(c)t.scrollLeft=c.offsetLeft-t.offsetLeft-20},50)}
function verFrente(id){S.fFrente=id;S.fTipo="todos";S.fPer="todos";S.tb.lanc={};go("lanc")}
function fxTxt(id){const m={};S.mov.filter(x=>x.status!=="cancelado"&&x.tipo==="investimento"&&x.frente_id===id&&x.moeda&&x.moeda!=="BRL"&&x.valor_me).forEach(x=>{m[x.moeda]=m[x.moeda]||{me:0,brl:0};m[x.moeda].me+=Number(x.valor_me);m[x.moeda].brl+=Number(x.valor)});
  return Object.entries(m).map(([k,v])=>`<span>${MOEDAS[k]} ${Math.round(v.me).toLocaleString("pt-BR")} enviados · câmbio médio ${(v.brl/v.me).toFixed(2).replace(".",",")}</span>`).join("")}
function frentesCard(T){
  const fs=S.frentes.filter(f=>f.ativo!==false);
  return `<div class="card"><h2 style="margin-top:0">Por frente</h2>${fs.map(f=>{const x=T.porFr[f.id]||{inv:0,ret:0};const pc=f.orcamento>0?x.inv/f.orcamento*100:0;const res=x.ret-x.inv;
    return `<div class="fr"><div class="top"><div class="n"><button class="lk" onclick="verFrente('${f.id}')">${esc(f.nome)}</button></div><div class="p">${brl(x.inv)} de ${brl(f.orcamento)}</div></div>
    <div class="bar"><b class="${pc>100?"over":""}" style="width:${Math.min(100,pc).toFixed(1)}%"></b></div>
    <div class="meta"><span>${pc.toFixed(0)}% usado</span>${fxTxt(f.id)}<span>Retorno ${brl(x.ret)}</span><span class="${res>=0?"pos":"neg"}">Resultado ${res>=0?"+":""}${brl(res)}</span></div></div>`}).join("")||'<p class="muted">Nenhuma frente.</p>'}</div>`;
}
const MOEDAS={BRL:"R$",USD:"US$",EUR:"€"};
function meTxt(x){return x.moeda&&x.moeda!=="BRL"&&x.valor_me?`${MOEDAS[x.moeda]||x.moeda} ${Number(x.valor_me).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})} a R$ ${Number(x.cambio).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:4})}`:""}
function itemHTML(x){const t=TIPOS[x.tipo]||{ic:"·",n:x.tipo};const sinal=x.tipo==="investimento"?"−":"+";
  const sub=[dShort(x.data),x.tipo==="aporte"?(x.quem||""):frName(x.frente_id),meTxt(x),x.descricao].filter(Boolean).map(esc).join(" · ");
  return `<div class="item ${x.status==="cancelado"?"cx":""}" onclick="openItem('${x.id}')"><div class="dot t-${x.tipo}">${t.ic}</div>
  <div class="mid"><div class="a">${t.n}${x.status==="cancelado"?" (cancelado)":""}</div><div class="b">${sub}</div></div><div class="val">${sinal} ${brl(x.valor)}</div></div>`}

function ym(iso){return iso?iso.slice(0,7):""}
function perOk(x){const t=todayISO(),cm=ym(t);const d=new Date();const pm=new Date(d.getFullYear(),d.getMonth()-1,1);const pmS=`${pm.getFullYear()}-${String(pm.getMonth()+1).padStart(2,"0")}`;
  if(S.fPer==="mes")return ym(x.data)===cm;if(S.fPer==="ant")return ym(x.data)===pmS;if(S.fPer==="ano")return x.data.slice(0,4)===t.slice(0,4);if(S.fPer==="esc")return !S.fMes||ym(x.data)===S.fMes;return true}
function chipsRow(lbl,opts,cur,fn){return `<span class="flabel">${lbl}</span><div class="chips">${opts.map(([k,n])=>`<button class="chip ${cur===k?"on":""}" onclick="${fn}('${k}')">${n}</button>`).join("")}</div>`}
function setPer(k){S.fPer=S.fPer===k&&k!=="todos"?"todos":k;render()}
function setTipoF(k){S.fTipo=S.fTipo===k&&k!=="todos"?"todos":k;render()}
function setFr(k){S.fFrente=S.fFrente===k&&k!=="todas"?"todas":k;render()}
function rLanc(){
  const base=S.mov.filter(x=>x.status!=="cancelado").filter(perOk);
  const porTipo=base.filter(x=>S.fTipo==="todos"||x.tipo===S.fTipo);
  // regra 11: 3 frentes com mais movimento no período
  const cnt={};porTipo.forEach(x=>{const k=x.frente_id||"__aporte";cnt[k]=(cnt[k]||0)+1});
  const ranked=Object.entries(cnt).filter(([k])=>k!=="__aporte").sort((a,b)=>b[1]-a[1]);
  const top=ranked.slice(0,3),rest=ranked.slice(3);
  if(S.fFrente!=="todas"&&!top.some(([k])=>k===S.fFrente)&&!rest.some(([k])=>k===S.fFrente)){top.push([S.fFrente,0])}
  const list=porTipo.filter(x=>S.fFrente==="todas"||x.frente_id===S.fFrente);
  const sel=rest.find(([k])=>k===S.fFrente);
  $("#pane").innerHTML=chipsRow("Período",[["mes","Este mês"],["ant","Mês passado"],["ano","Este ano"],["todos","Tudo"]],S.fPer,"setPer")
   +`<input type="month" class="outras" style="display:inline-block;margin:-4px 0 10px 4px" value="${S.fPer==="esc"?S.fMes:""}" onchange="S.fPer='esc';S.fMes=this.value;render()" title="Outro mês">`
   +chipsRow("Tipo",[["todos","Todos"],...Object.entries(TIPOS).map(([k,v])=>[k,v.n])],S.fTipo,"setTipoF")
   +`<span class="flabel">Frente</span><div class="chips"><button class="chip ${S.fFrente==="todas"?"on":""}" onclick="setFr('todas')">Todas</button>${top.map(([k,n])=>`<button class="chip ${S.fFrente===k?"on":""}" onclick="setFr('${k}')">${esc(frName(k))} (${n})</button>`).join("")}
     ${rest.length?`<select class="outras" onchange="if(this.value)setFr(this.value)"><option value="">Outras frentes (${rest.length})</option>${rest.map(([k,n])=>`<option value="${k}" ${sel&&sel[0]===k?"selected":""}>${esc(frName(k))} (${n})</option>`).join("")}</select>`:""}</div>`
   +(list.length?tabela("lanc",list,false):`<div class="card empty"><p class="muted">Nada neste filtro.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn g sm" onclick="S.fPer='todos';S.fTipo='todos';S.fFrente='todas';render()">Ver tudo</button></div></div>`);

/* ---------- TABELA viva (regras 6 e 10) ---------- */
const COLS=[{k:"data",n:"Data",t:"d"},{k:"tipo",n:"Tipo",t:"s"},{k:"alvo",n:"Frente / pessoa",t:"s"},{k:"descricao",n:"Descrição",t:"s"},{k:"valor",n:"Valor",t:"n",r:1}];
function rowVal(x,k){if(k==="alvo")return x.tipo==="aporte"?(x.quem||""):frName(x.frente_id);if(k==="tipo")return TIPOS[x.tipo].n+(x.status==="cancelado"?" (cancelado)":"");if(k==="valor")return (x.tipo==="investimento"?-1:1)*Number(x.valor);if(k==="descricao")return [meTxt(x),x.descricao].filter(Boolean).join(" · ");return x[k]||""}
function numFilt(f,v){const m=f.replace(/\s/g,"").match(/^(>=|<=|>|<|=)?(.+)$/);const n=parseBRL(m[2]);if(isNaN(n))return true;const a=Math.abs(v);switch(m[1]){case">":return a>n;case"<":return a<n;case">=":return a>=n;case"<=":return a<=n;default:return a===n}}
function tabela(id,list,status){const st=S.tb[id]||(S.tb[id]={});const f=st.f||{};
  let rows=list.filter(x=>COLS.every(c=>{const q=(f[c.k]||"").trim();if(!q)return true;const v=rowVal(x,c.k);if(c.t==="n")return numFilt(q,v);if(c.t==="d")return dShort(x.data).includes(q)||x.data.includes(q);return String(v).toLowerCase().includes(q.toLowerCase())}));
  if(st.s){const c=COLS.find(c=>c.k===st.s);rows=[...rows].sort((a,b)=>{let A=rowVal(a,c.k),B=rowVal(b,c.k);if(c.t==="n"){A=Math.abs(A);B=Math.abs(B)}const r=c.t==="n"?A-B:String(A).localeCompare(String(B),"pt");return st.d==="desc"?-r:r})}
  const tot=rows.reduce((s,x)=>s+(x.status==="cancelado"?0:rowVal(x,"valor")),0);
  const nf=Object.values(f).filter(v=>v&&v.trim()).length;
  return `<div class="tbinfo"><span>Mostrando ${rows.length} de ${list.length} linha(s)${nf?` · <button class="lk" style="font:inherit;color:inherit" onclick="S.tb['${id}'].f={};render()">limpar filtros</button>`:""}</span><span>saldo ${brl(tot)}</span></div>
  <div class="tw"><table class="tb" data-tb="${id}"><thead><tr>${COLS.map(c=>`<th class="${c.r?"r":""}" data-s="${c.k}">${c.n}${st.s===c.k?(st.d==="desc"?" ▼":" ▲"):""}</th>`).join("")}</tr>
  <tr class="fl">${COLS.map(c=>`<th><input data-f="${c.k}" value="${esc(f[c.k]||"")}" placeholder="${c.t==="n"?">1000":"filtrar"}" inputmode="${c.t==="n"?"decimal":"text"}"></th>`).join("")}</tr></thead>
  <tbody>${rows.map(x=>{const v=rowVal(x,"valor");return `<tr class="${x.status==="cancelado"?"cx":""}" onclick="openItem('${x.id}')"><td>${dShort(x.data)}</td>
   <td><span class="pill t-${x.tipo}">${TIPOS[x.tipo].ic} ${TIPOS[x.tipo].n}${x.status==="cancelado"?" · cancelado":""}</span></td>
   <td>${x.tipo==="aporte"?esc(x.quem||"—"):`<button class="lk" onclick="event.stopPropagation();verFrente('${x.frente_id}')">${esc(frName(x.frente_id))}</button>`}</td>
   <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rowVal(x,"descricao"))}</td>
   <td class="r" style="font-weight:600;white-space:nowrap"><button class="lk" style="text-decoration:none">${v<0?"−":"+"} ${brl(Math.abs(v))}</button></td></tr>`}).join("")||`<tr><td colspan="5" class="muted">Nenhuma linha com esses filtros.</td></tr>`}</tbody></table></div>`}
function tbBind(id){const t=document.querySelector(`table[data-tb="${id}"]`);if(!t)return;const st=S.tb[id];
  t.querySelectorAll("thead th[data-s]").forEach(th=>th.onclick=()=>{const k=th.dataset.s;const c=COLS.find(c=>c.k===k);
    if(st.s!==k){st.s=k;st.d=c.t==="n"?"desc":"asc"}else if(st.d===(c.t==="n"?"desc":"asc")){st.d=c.t==="n"?"asc":"desc"}else{st.s=null;st.d=null}render()});
  t.querySelectorAll("thead input[data-f]").forEach(inp=>inp.oninput=()=>{st.f=st.f||{};st.f[inp.dataset.f]=inp.value;const pos=inp.selectionStart;const k=inp.dataset.f;render();const n=document.querySelector(`table[data-tb="${id}"] input[data-f="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}})}

function copyBackup(b){const rows=[["data","tipo","frente","quem","valor","descricao","comprovante","status"],...S.mov.map(x=>[x.data,x.tipo,frName(x.frente_id),x.quem||"",String(x.valor).replace(".",","),x.descricao||"",x.comprovante||"",x.status])];
  const txt=rows.map(r=>r.map(c=>String(c).replace(/[\t\n]/g," ")).join("\t")).join("\n");

function editBox(x){
  if(!ed())return `<dl class="det">
    <dt>Tipo</dt><dd>${TIPOS[x.tipo].n}</dd><dt>Data</dt><dd>${dLong(x.data)}</dd><dt>Valor</dt><dd>${brl2(x.valor)}${meTxt(x)?`<br><span class="muted">${esc(meTxt(x))}</span>`:""}</dd>
    ${x.tipo==="aporte"?`<dt>De quem</dt><dd>${esc(x.quem||"—")}</dd>`:`<dt>Frente</dt><dd><button class="lk" onclick="fecharQuadro();verFrente('${x.frente_id}')">${esc(frName(x.frente_id))}</button></dd>`}
    <dt>Descrição</dt><dd>${esc(x.descricao||"—")}</dd><dt>Comprovante</dt><dd>${x.comprovante?`<a href="${esc(x.comprovante)}" target="_blank" rel="noopener">abrir</a>`:"—"}</dd>

    <div class="row" style="margin-top:16px"><button class="btn g" onclick="fecharQuadro()">Fechar</button></div>`;
  return `${formHTML(x,"e")}
   <div class="row">${x.status==="cancelado"?`<button class="btn" onclick="reativar('${x.id}')">Reativar</button>`:`<button class="btn" onclick="salvar('e','${x.id}')">Salvar</button>`}
   <button class="btn g" onclick="fecharEdit(this)">Fechar</button>${x.status!=="cancelado"?`<button class="btn r" onclick="cancelar('${x.id}',this)">Cancelar lançamento</button>`:""}</div>`;

function fecharEdit(b){const x=S.mov.find(m=>m.id===S.editId);const cur=readForm("e");
  const changed=x&&cur&&(cur.data!==x.data||cur.tipo!==x.tipo||String(parseBRL(cur.valor))!==String(Number(x.valor))||(cur.descricao||"")!==(x.descricao||"")||(cur.frente_id||null)!==(x.frente_id||null)||(cur.quem||"")!==(x.quem||"")||(cur.comprovante||"")!==(x.comprovante||""));
  if(changed&&!confirmTwice("close","Fechar sem salvar? Toque de novo.",b))return;fecharQuadro()}

  <div class="f"><label class="lb" for="${p}-valor">Valor (R$)</label><div class="favs" id="${p}-favs"></div><input id="${p}-valor" inputmode="decimal" placeholder="Ex.: 50.000" value="${v.valor!=null&&v.valor!==""?esc(typeof v.valor==="number"?String(v.valor).replace(".",","):v.valor):""}" oninput="valHint('${p}')"><div class="hint" id="${p}-valHint">${v.valor?"→ "+brl2(parseBRL(typeof v.valor==="number"?String(v.valor).replace(".",","):v.valor)):""}</div></div>

   <div id="${p}-cbBox" ${(v.moeda||"BRL")==="BRL"?"hidden":""}><label class="lb" for="${p}-cambio" style="margin-top:8px">Câmbio (R$ por 1 <span id="${p}-moN">${MOEDAS[v.moeda]||"US$"}</span>)</label>

function frOpts(p,sel){return S.frentes.filter(f=>f.ativo!==false||f.id===sel).map(f=>`<button type="button" class="opt ${sel===f.id?"on":""}" onclick="pickFr('${p}','${f.id}')">${esc(f.nome)}</button>`).join("")+`<button type="button" class="opt add" onclick="newFrInline('${p}')">＋ Nova frente…</button>`}
function setTipo(p,t){$("#"+p+"-tipo").value=t;document.querySelectorAll(`#${p}-tipoOpts .opt`).forEach(b=>b.classList.toggle("on",b.textContent===TIPOS[t].n));
  $("#"+p+"-tipoHint").textContent=TIPOS[t].d;favRender(p);$("#"+p+"-quemBox").hidden=t!=="aporte";if($("#"+p+"-meBox"))$("#"+p+"-meBox").hidden=t==="aporte";$("#"+p+"-frBox").hidden=t==="aporte";syncDraft(p)}
function dateHint(p){const v=$("#"+p+"-data").value;$("#"+p+"-dataHint").textContent=v?"→ "+dLong(v):""}
function topValores(tipo){const c={};S.mov.filter(x=>x.status!=="cancelado"&&(!tipo||x.tipo===tipo)).forEach(x=>{const v=Number(x.valor);c[v]=(c[v]||0)+1});
  const r=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([v])=>Number(v)).slice(0,3);for(const d of [10000,50000,100000]){if(r.length>=3)break;if(!r.includes(d))r.push(d)}return r}
const fmtV=v=>Number(v).toLocaleString("pt-BR",{maximumFractionDigits:2});
let FAVED=false;
function favRender(p){const box=$("#"+p+"-favs");if(!box)return;const tipo=$("#"+p+"-tipo").value;const favs=lsGet("inv-favs",[]);const cur=parseBRL($("#"+p+"-valor").value);
  const sug=topValores(tipo).filter(v=>!favs.includes(v));
  box.innerHTML=[...sug.map(v=>`<button type="button" class="opt ${cur===v?"on":""}" onclick="pickVal('${p}',${v})">${fmtV(v)}</button>`),
    ...favs.map(v=>`<span class="fav"><button type="button" class="opt ${cur===v?"on":""}" onclick="pickVal('${p}',${v})">★ ${fmtV(v)}</button>${FAVED?`<button type="button" class="x" onclick="delFav(${v},'${p}')">×</button>`:""}</span>`),
    `<button type="button" class="opt add" onclick="addFav('${p}')">+ favorito</button>`,favs.length?`<button type="button" class="opt add" onclick="FAVED=!FAVED;favRender('${p}')">✎</button>`:""].join("")}
function pickVal(p,v){$("#"+p+"-valor").value=fmtV(v);valHint(p);syncDraft(p)}
function addFav(p){const v=parseBRL($("#"+p+"-valor").value);if(isNaN(v)||v<=0){toast("Digite o valor no campo e toque em + favorito.");$("#"+p+"-valor").focus();return}const f=lsGet("inv-favs",[]);if(!f.includes(v)){f.push(v);lsSet("inv-favs",f)}favRender(p);toast("Favorito salvo neste aparelho.")}
function delFav(v,p){lsSet("inv-favs",lsGet("inv-favs",[]).filter(x=>x!==v));favRender(p)}
function setMoeda(p,m){$("#"+p+"-moeda").value=m;document.querySelectorAll(`#${p}-moOpts .opt`).forEach((b,i)=>b.classList.toggle("on",Object.keys(MOEDAS)[i]===m));
  $("#"+p+"-cbBox").hidden=m==="BRL";$("#"+p+"-moN").textContent=MOEDAS[m];meHint(p);syncDraft(p)}
function meHint(p){const box=$("#"+p+"-cbFav");if(!box)return;const m=$("#"+p+"-moeda").value;const cb=parseBRL($("#"+p+"-cambio").value);const v=parseBRL($("#"+p+"-valor").value);
  const usados=[...new Set(S.mov.filter(x=>x.moeda===m&&x.cambio).map(x=>Number(x.cambio)))].slice(0,3);const sug=[...usados,...(m==="EUR"?[6.2,6.4,6.6]:[5.8,5.6,6.0])].filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
  box.innerHTML=sug.map(c=>`<button type="button" class="opt ${cb===c?"on":""}" onclick="$('#${p}-cambio').value='${String(c).replace(".",",")}';meHint('${p}')">${String(c.toFixed(2)).replace(".",",")}</button>`).join("");
  $("#"+p+"-meHint").textContent=!isNaN(cb)&&cb>0&&!isNaN(v)?`→ ${MOEDAS[m]} ${(v/cb).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})} enviados`:"";}
function valHint(p){favRender(p);if($("#"+p+"-cambio"))meHint(p);const n=parseBRL($("#"+p+"-valor").value);$("#"+p+"-valHint").textContent=isNaN(n)?"":"→ "+brl2(n)}
function pickQuem(p,q){$("#"+p+"-quem").value=q;markQuem(p);syncDraft(p)}
function markQuem(p){const v=$("#"+p+"-quem").value.trim().toLowerCase();document.querySelectorAll(`[data-g="${p}-quem"]`).forEach(b=>b.classList.toggle("on",b.dataset.v.toLowerCase()===v))}
function pickFr(p,id){$("#"+p+"-frente").value=id;$("#"+p+"-frOpts").innerHTML=frOpts(p,id);$("#"+p+"-frNew").innerHTML="";syncDraft(p)}
function newFrInline(p){$("#"+p+"-frNew").innerHTML=`<div class="inline" style="margin-top:8px"><label class="lb">Nome da nova frente</label><input id="${p}-nfNome" placeholder="Ex.: Pet white label">
  <label class="lb" style="margin-top:10px">Orçamento planejado (R$)</label><input id="${p}-nfOrc" inputmode="decimal" placeholder="Ex.: 100.000">
  <div class="row" style="margin-top:10px"><button type="button" class="btn sm" onclick="saveFrInline('${p}')">Criar e selecionar</button><button type="button" class="btn g sm" onclick="$('#${p}-frNew').innerHTML=''">Fechar</button></div></div>`;$("#"+p+"-nfNome").focus()}
async function saveFrInline(p){const nome=$("#"+p+"-nfNome").value.trim();const orc=parseBRL($("#"+p+"-nfOrc").value||"0");
  if(!nome){$("#"+p+"-nfNome").classList.add("err");$("#"+p+"-nfNome").focus();toast("Digite o nome da frente.");return}
  if(S.frentes.some(f=>f.nome.toLowerCase()===nome.toLowerCase())){toast("Essa frente já existe.");return}
  if(isNaN(orc)){$("#"+p+"-nfOrc").classList.add("err");toast("Orçamento inválido.");return}
  const r=await sb.from("invest_frentes").insert({nome,orcamento:orc,ordem:S.frentes.length+1}).select().single();
  if(r.error){toast("Erro ao criar: "+r.error.message);return}
  S.frentes.push(r.data);pickFr(p,r.data.id);toast("Frente criada.")}
function readForm(p){if(!$("#form-"+p))return null;return{tipo:$("#"+p+"-tipo").value,data:$("#"+p+"-data").value,quem:$("#"+p+"-quem").value.trim(),frente_id:$("#"+p+"-frente").value||null,valor:$("#"+p+"-valor").value.trim(),moeda:$("#"+p+"-moeda")?$("#"+p+"-moeda").value:"BRL",cambio:$("#"+p+"-cambio")?$("#"+p+"-cambio").value.trim():"",descricao:$("#"+p+"-desc").value.trim(),comprovante:$("#"+p+"-comp").value.trim()}}
function syncDraft(p){if(p==="n")S.draft=readForm("n")}
function err(p,id,msg){const m=$("#"+p+"-msg");m.innerHTML=`<div class="msg e">${esc(msg)}</div>`;const el=$("#"+id);if(el){el.classList.add("err");el.focus&&el.focus();el.scrollIntoView({block:"center",behavior:"smooth"})}return false}
function validate(p,d){document.querySelectorAll(`#form-${p} .err`).forEach(e=>e.classList.remove("err"));
  if(!d.data)return err(p,p+"-data","Escolha a data.");
  if(d.tipo==="aporte"&&!d.quem)return err(p,p+"-quem","Diga de quem é o aporte (Tae, Neiva ou outro nome).");
  if(d.tipo!=="aporte"&&!d.frente_id)return err(p,p+"-frOpts","Escolha a frente deste "+(d.tipo==="retorno"?"retorno":"investimento")+".");
  const v=parseBRL(d.valor);if(isNaN(v)||v<=0)return err(p,p+"-valor","Digite o valor (ex.: 50.000 ou 1.250,50).");
  if(d.tipo!=="aporte"&&d.moeda!=="BRL"){const c=parseBRL(d.cambio);if(isNaN(c)||c<=0)return err(p,p+"-cambio","Digite o câmbio (ex.: 5,80).")}
  if(d.comprovante&&!/^https?:\/\//i.test(d.comprovante))return err(p,p+"-comp","O link do comprovante precisa começar com http:// ou https://");
  return true}
async function salvar(p,id){const d=readForm(p);if(!validate(p,d))return;
  const row={data:d.data,tipo:d.tipo,valor:parseBRL(d.valor),descricao:d.descricao||null,comprovante:d.comprovante||null,quem:d.tipo==="aporte"?d.quem:null,frente_id:d.tipo==="aporte"?null:d.frente_id};
  const fx=d.tipo!=="aporte"&&d.moeda!=="BRL";const cb=parseBRL(d.cambio);row.moeda=fx?d.moeda:"BRL";row.cambio=fx?cb:null;row.valor_me=fx?Math.round(parseBRL(d.valor)/cb*100)/100:null;
  const r=id?await sb.from("invest_mov").update(row).eq("id",id):await sb.from("invest_mov").insert(row);
  if(r.error){$("#"+p+"-msg").innerHTML=`<div class="msg e">Não salvou: ${esc(r.error.message)}</div>`;return}
  toast(id?"Alterações salvas.":"Lançamento salvo.");if(id)fecharQuadro();S.draft=id?S.draft:{tipo:d.tipo,data:d.data};await reloadAll()}
async function cancelar(id,b){if(!confirmTwice("cx"+id,"Cancelar mesmo? Toque de novo.",b))return;
  const r=await sb.from("invest_mov").update({status:"cancelado",canceled_at:new Date().toISOString()}).eq("id",id);if(r.error){toast("Erro: "+r.error.message);return}
  toast("Lançamento cancelado (fica no Histórico).");fecharQuadro();await reloadAll()}
async function reativar(id){const r=await sb.from("invest_mov").update({status:"ativo",canceled_at:null}).eq("id",id);if(r.error){toast("Erro: "+r.error.message);return}toast("Lançamento reativado.");fecharQuadro();await reloadAll()}

/* ---------- IMPORTAÇÃO ---------- */
function importHTML(){return `<p class="muted">Uma linha por lançamento, colunas nesta ordem (separadas por TAB ou ;):<br><b>data · tipo · frente ou pessoa · valor · descrição</b></p>
 <p class="muted" style="margin-top:6px">Ex.: <code>18/11/2026;aporte;Tae;250.000;1ª parcela</code><br><code>20/11/2026;investimento;San Martino;80.000;produção</code></p>
 <textarea id="impTxt" style="margin-top:10px;min-height:120px" placeholder="Cole aqui as linhas da planilha"></textarea>
 <div class="row" style="margin-top:10px"><button class="btn sm" onclick="impPreview()">Pré-visualizar</button></div><div id="impOut"></div>`}
function parseDateAny(s){s=String(s||"").trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/)){let y=m[3].length===2?"20"+m[3]:m[3];const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return null;return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
  return null}
function normTipo(s){s=String(s||"").toLowerCase().trim();if(/^ap/.test(s))return"aporte";if(/^inv|^gasto|^desp/.test(s))return"investimento";if(/^ret|^lucro|^receb/.test(s))return"retorno";return null}
let IMP=[];
function impPreview(){const lines=$("#impTxt").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);IMP=[];
  lines.forEach((l,i)=>{const c=l.split(l.includes("\t")?"\t":";").map(x=>x.trim());
    if(i===0&&/data/i.test(c[0])&&/tipo/i.test(c[1]||""))return;
    const it={linha:i+1,raw:l,data:parseDateAny(c[0]),tipo:normTipo(c[1]),alvo:c[2]||"",valor:parseBRL(c[3]),descricao:c[4]||""};const e=[];
    if(!it.data)e.push("data");if(!it.tipo)e.push("tipo");if(isNaN(it.valor)||it.valor<=0)e.push("valor");if(!it.alvo)e.push(it.tipo==="aporte"?"pessoa":"frente");
    it.novaFr=it.tipo&&it.tipo!=="aporte"&&it.alvo&&!S.frentes.some(f=>f.nome.toLowerCase()===it.alvo.toLowerCase());
    it.dup=!e.length&&S.mov.some(m=>m.status!=="cancelado"&&m.data===it.data&&m.tipo===it.tipo&&Number(m.valor)===it.valor&&(it.tipo==="aporte"?(m.quem||"").toLowerCase()===it.alvo.toLowerCase():frName(m.frente_id).toLowerCase()===it.alvo.toLowerCase()));
    it.err=e;IMP.push(it)});
  const ok=IMP.filter(x=>!x.err.length&&!x.dup),dup=IMP.filter(x=>x.dup),bad=IMP.filter(x=>x.err.length);
  const novas=[...new Set(ok.filter(x=>x.novaFr).map(x=>x.alvo))];
  $("#impOut").innerHTML=`<p class="muted" style="margin-top:10px"><b class="pos">${ok.length} prontos</b> · ${dup.length} possíveis duplicados (serão pulados) · <b class="neg">${bad.length} com erro</b></p>
  ${novas.length?`<p class="hint">Frentes novas que serão criadas: ${novas.map(esc).join(", ")}</p>`:""}
  <div class="tw" style="max-height:50vh"><table class="tb" data-tb="off" style="min-width:520px"><thead><tr><th>#</th><th>Data</th><th>Tipo</th><th>Frente/pessoa</th><th>Valor</th><th>Situação</th></tr></thead><tbody>
  ${IMP.map(x=>`<tr><td>${x.linha}</td><td>${x.data?dShort(x.data):"?"}</td><td>${x.tipo?TIPOS[x.tipo].n:"?"}</td><td>${esc(x.alvo)}${x.novaFr?' <span class="hint">(nova)</span>':""}</td><td>${isNaN(x.valor)?"?":brl2(x.valor)}</td>
   <td>${x.err.length?`<span class="neg">corrigir: ${x.err.join(", ")}</span>`:x.dup?"duplicado":'<span class="pos">ok</span>'}</td></tr>`).join("")}</tbody></table></div>
  ${ok.length?`<button class="btn sm" onclick="impRun(this)">Importar ${ok.length} lançamento(s)</button>`:""}`}
async function impRun(b){b.disabled=true;const ok=IMP.filter(x=>!x.err.length&&!x.dup);
  for(const nome of [...new Set(ok.filter(x=>x.novaFr).map(x=>x.alvo))]){const r=await sb.from("invest_frentes").insert({nome,orcamento:0,ordem:S.frentes.length+1}).select().single();if(r.error){toast("Erro ao criar frente "+nome);b.disabled=false;return}S.frentes.push(r.data)}
  const rows=ok.map(x=>({data:x.data,tipo:x.tipo,valor:x.valor,descricao:x.descricao||null,quem:x.tipo==="aporte"?x.alvo:null,frente_id:x.tipo==="aporte"?null:S.frentes.find(f=>f.nome.toLowerCase()===x.alvo.toLowerCase()).id}));
  const r=await sb.from("invest_mov").insert(rows);if(r.error){toast("Erro: "+r.error.message);b.disabled=false;return}
  toast(rows.length+" lançamento(s) importado(s).");S.draft=null;S.tab="lanc";await reloadAll()}

/* ---------- AJUSTES ---------- */
function rAjustes(){
  const T=totals();
  $("#pane").innerHTML=`<div class="two"><div class="card"><h2 style="margin-top:0">Frentes e orçamentos</h2>
   <p class="muted">Orçamento total planejado: <b>${brl(T.orc)}</b></p><div style="margin-top:10px">
   ${S.frentes.map(f=>S.frEdit===f.id?`<div class="inline"><label class="lb">Nome</label><input id="fe-nome" value="${esc(f.nome)}">
     <label class="lb" style="margin-top:10px">Orçamento (R$)</label><input id="fe-orc" inputmode="decimal" value="${String(f.orcamento).replace(".",",")}">
     <label class="lb" style="margin-top:10px">Etapas da pista (uma por linha)</label><textarea id="fe-et" style="min-height:150px" placeholder="Planejamento&#10;Compra&#10;Envio&#10;Vendas&#10;Retorno">${esc(etapas(f).join("\n"))}</textarea>
     <p class="hint">Deixe vazio para não mostrar a pista desta frente.</p>
     <div class="row" style="margin-top:10px"><button class="btn sm" onclick="saveFr('${f.id}')">Salvar</button><button class="btn g sm" onclick="S.frEdit=null;render()">Fechar</button>
     <button class="btn ${f.ativo===false?"":"r"} sm" onclick="toggleFr('${f.id}',this)">${f.ativo===false?"Reativar frente":"Desativar frente"}</button></div></div>`
    :`<div class="item ${f.ativo===false?"cx":""}" onclick="S.frEdit='${f.id}';render()"><div class="mid"><div class="a">${esc(f.nome)}${f.ativo===false?" (desativada)":""}</div><div class="b">Orçamento ${brl(f.orcamento)} · investido ${brl((T.porFr[f.id]||{}).inv)}</div></div><div class="b muted">editar</div></div>`).join("")}</div>
   <button class="btn g sm" onclick="addFr()">＋ Nova frente</button></div>
   <div class="card"><h2 style="margin-top:0">Acesso</h2><p class="muted">Quem pode ver o app. <b>Leitor</b> só vê; <b>Editor</b> lança e edita.</p><div style="margin-top:10px">
   ${S.acesso.map(a=>`<div class="item" style="cursor:default"><div class="mid"><div class="a">${esc(a.nome||a.email)}</div><div class="b">${esc(a.email)} · ${a.papel==="editor"?"Editor":"Leitor"}</div></div>
     ${a.email.toLowerCase()!==S.user.email.toLowerCase()?`<button class="btn r sm" onclick="delAcc('${esc(a.email)}',this)">Remover</button>`:'<span class="muted">você</span>'}</div>`).join("")}</div>
   <div class="inline"><label class="lb">Liberar novo e-mail</label><input id="acEmail" type="email" inputmode="email" placeholder="email.da.neiva@…">
    <label class="lb" style="margin-top:10px">Nome</label><input id="acNome" placeholder="Neiva">
    <div class="opts" style="margin-top:10px"><button type="button" class="opt on" data-p="leitor" onclick="pickPapel(this)">Leitor (só vê)</button><button type="button" class="opt" data-p="editor" onclick="pickPapel(this)">Editor</button></div>
    <button class="btn sm" onclick="addAcc()">Liberar acesso</button>
    <p class="hint">Depois mande para a pessoa: o link do app + “toque em Primeiro acesso e crie sua senha com este e-mail”.</p></div></div></div>`;
}
let PAPEL="leitor";function pickPapel(b){PAPEL=b.dataset.p;b.parentNode.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b))}
async function addAcc(){const e=$("#acEmail").value.trim().toLowerCase(),n=$("#acNome").value.trim();
  if(!/^\S+@\S+\.\S+$/.test(e)){$("#acEmail").classList.add("err");$("#acEmail").focus();toast("Digite um e-mail válido.");return}
  if(S.acesso.some(a=>a.email.toLowerCase()===e)){toast("Esse e-mail já tem acesso.");return}
  const r=await sb.from("invest_acesso").insert({email:e,nome:n||null,papel:PAPEL});if(r.error){toast("Erro: "+r.error.message);return}
  PAPEL="leitor";toast("Acesso liberado.");await reloadAll()}
async function delAcc(e,b){if(!confirmTwice("da"+e,"Remover? Toque de novo.",b))return;const r=await sb.from("invest_acesso").delete().eq("email",e);if(r.error){toast("Erro: "+r.error.message);return}toast("Acesso removido.");await reloadAll()}
async function saveFr(id){const nome=$("#fe-nome").value.trim(),orc=parseBRL($("#fe-orc").value||"0");
  if(!nome){$("#fe-nome").classList.add("err");toast("Digite o nome.");return}if(isNaN(orc)){$("#fe-orc").classList.add("err");toast("Orçamento inválido.");return}
  const et=$("#fe-et").value.split(/\n/).map(x=>x.trim()).filter(Boolean);const f0=S.frentes.find(x=>x.id===id);
  const r=await sb.from("invest_frentes").update({nome,orcamento:orc,etapas:et,etapa:Math.min(f0.etapa||0,Math.max(0,et.length-1))}).eq("id",id);if(r.error){toast("Erro: "+r.error.message);return}S.frEdit=null;toast("Frente salva.");await reloadAll()}
async function toggleFr(id,b){const f=S.frentes.find(x=>x.id===id);if(f.ativo!==false&&!confirmTwice("tf"+id,"Desativar? Toque de novo.",b))return;
  const r=await sb.from("invest_frentes").update({ativo:f.ativo===false}).eq("id",id);if(r.error){toast("Erro: "+r.error.message);return}S.frEdit=null;await reloadAll()}
async function addFr(){const r=await sb.from("invest_frentes").insert({nome:"Nova frente "+(S.frentes.length+1),orcamento:0,ordem:S.frentes.length+1}).select().single();if(r.error){toast("Erro: "+r.error.message);return}S.frentes.push(r.data);S.frEdit=r.data.id;render();setTimeout(()=>{$("#fe-nome")&&($("#fe-nome").select())},30)}

$("#verLink").textContent="Versão "+APP_VERSAO;
boot();checaVersao();
</script>
